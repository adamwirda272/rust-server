[package]
name = "my-server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.2"
actix-web = "4.18.1"
argon2 = "0.6.0"
chrono = {version = "0.4.45", features = ["serde"]}
dotenvy = "0.15.7"
env_logger = "0.11.11"
futures = "0.3.34"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
log = "0.4.34"
mongodb = "3.10.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dependencies.uuid]
version = "1.29.0"
features = [
    "v4",
]